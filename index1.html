<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concentric Circles</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
        }

        .container {
            position: relative;
            width: 60px;
            height: 60px;
        }

        .container.top {
            margin: 46px auto 0;
        }

        .container.bottom {
            margin: 80px auto 0;
        }

        .circle {
            position: absolute;
            top: 50%;
            left: 50%;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .outer {
            width: 60px;
            height: 60px;
            background: #ed1c24;
        }

        .middle {
            width: 40px;
            height: 40px;
            background: #fff200;
        }

        .inner {
            width: 20px;
            height: 20px;
            background: #2240b8;
        }
    </style>
</head>

<body>
    <div class="container top">
        <div class="circle outer"></div>
        <div class="circle middle"></div>
        <div class="circle inner"></div>
    </div>

    <div class="container bottom">
        <div class="circle outer"></div>
        <div class="circle middle"></div>
        <div class="circle inner"></div>
    </div>
</body>
</html>
